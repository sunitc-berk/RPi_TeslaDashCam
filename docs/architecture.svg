<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="#141413"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="#FAF9F6"/>

  <text x="60" y="64" font-size="30" font-weight="700" fill="#141413" letter-spacing="-0.02em">How the footage gets home</text>
  <text x="60" y="94" font-size="17" fill="#4A4946">The car thinks the Pi is a USB stick. The Pi copies finished clips to the PC over Wi-Fi, and the dashboard indexes what arrived.</text>

  <!-- ============ TESLA ============ -->
  <g transform="translate(60,150)">
    <rect width="270" height="300" rx="18" fill="#FFFFFF" stroke="#E8E5DE"/>
    <g transform="translate(80,36)" fill="none" stroke="#141413" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M12 44 L26 14 Q29 8 36 8 L76 8 Q83 8 86 14 L100 44"/>
      <path d="M4 48 Q4 44 10 44 L102 44 Q108 44 108 48 L108 70 Q108 76 102 76 L10 76 Q4 76 4 70 Z"/>
      <circle cx="26" cy="76" r="10" fill="#FFFFFF"/><circle cx="86" cy="76" r="10" fill="#FFFFFF"/>
      <path d="M18 58 L32 58 M80 58 L94 58"/>
    </g>
    <text x="135" y="156" text-anchor="middle" font-size="23" font-weight="700" fill="#141413">Tesla</text>
    <text x="135" y="186" text-anchor="middle" font-size="15.5" fill="#4A4946">Six cameras record one-minute</text>
    <text x="135" y="209" text-anchor="middle" font-size="15.5" fill="#4A4946">clips to the USB dashcam drive</text>
    <text x="135" y="256" text-anchor="middle" font-size="14" fill="#8A8883">Recent · Saved · Sentry clips</text>
    <text x="135" y="279" text-anchor="middle" font-size="14" fill="#8A8883">about 240 MB per minute of driving</text>
  </g>

  <!-- USB -->
  <g>
    <line x1="336" y1="300" x2="444" y2="300" stroke="#141413" stroke-width="3" marker-end="url(#arr)"/>
    <text x="390" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#141413">USB</text>
    <text x="390" y="328" text-anchor="middle" font-size="13.5" fill="#8A8883">glovebox port</text>
  </g>

  <!-- ============ PI ============ -->
  <g transform="translate(450,150)">
    <rect width="270" height="300" rx="18" fill="#FFFFFF" stroke="#141413" stroke-width="2"/>
    <g transform="translate(85,40)" fill="none" stroke="#141413" stroke-width="3.5" stroke-linejoin="round">
      <rect x="0" y="0" width="100" height="66" rx="8"/>
      <rect x="18" y="16" width="26" height="26" rx="3"/>
      <rect x="54" y="16" width="14" height="14" rx="2"/>
      <rect x="54" y="38" width="30" height="12" rx="2"/>
      <path d="M8 56 L34 56 M44 56 L66 56" stroke-width="3"/>
    </g>
    <text x="135" y="156" text-anchor="middle" font-size="23" font-weight="700" fill="#141413">Raspberry Pi 4</text>
    <text x="135" y="186" text-anchor="middle" font-size="15.5" fill="#4A4946">Acts as a 64 GB USB stick and</text>
    <text x="135" y="209" text-anchor="middle" font-size="15.5" fill="#4A4946">buffers finished clips on its SD</text>
    <text x="135" y="256" text-anchor="middle" font-size="14" fill="#8A8883">g_mass_storage · 40 GB buffer</text>
    <text x="135" y="279" text-anchor="middle" font-size="14" fill="#8A8883">survives the car cutting its power</text>
  </g>

  <!-- Wi-Fi -->
  <g>
    <line x1="726" y1="300" x2="834" y2="300" stroke="#141413" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arr)"/>
    <g transform="translate(766,226)" fill="none" stroke="#141413" stroke-width="3" stroke-linecap="round">
      <path d="M0 18 Q14 4 28 18"/><path d="M7 26 Q14 19 21 26"/><circle cx="14" cy="34" r="2.2" fill="#141413"/>
    </g>
    <text x="780" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#141413">Wi-Fi</text>
    <text x="780" y="328" text-anchor="middle" font-size="13.5" fill="#8A8883">about 10 MB/s</text>
    <text x="780" y="347" text-anchor="middle" font-size="13.5" fill="#8A8883">every 2 min</text>
  </g>

  <!-- ============ PC ============ -->
  <g transform="translate(840,150)">
    <rect width="270" height="300" rx="18" fill="#FFFFFF" stroke="#E8E5DE"/>
    <g transform="translate(85,38)" fill="none" stroke="#141413" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
      <rect x="0" y="0" width="100" height="62" rx="8"/>
      <path d="M36 78 L64 78 M50 62 L50 78"/>
    </g>
    <text x="135" y="156" text-anchor="middle" font-size="23" font-weight="700" fill="#141413">Windows PC</text>
    <text x="135" y="186" text-anchor="middle" font-size="15.5" fill="#4A4946">A shared folder receives the</text>
    <text x="135" y="209" text-anchor="middle" font-size="15.5" fill="#4A4946">clips and keeps 30 days of drives</text>
    <text x="135" y="256" text-anchor="middle" font-size="14" fill="#8A8883">SMB share · .part file, then rename</text>
    <text x="135" y="279" text-anchor="middle" font-size="14" fill="#8A8883">size checked before the Pi deletes</text>
  </g>

  <!-- same PC -->
  <g>
    <line x1="1116" y1="300" x2="1224" y2="300" stroke="#141413" stroke-width="3" marker-end="url(#arr)"/>
    <text x="1170" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#141413">same PC</text>
    <text x="1170" y="328" text-anchor="middle" font-size="13.5" fill="#8A8883">localhost:8080</text>
  </g>

  <!-- ============ DASHBOARD ============ -->
  <g transform="translate(1230,150)">
    <rect width="310" height="300" rx="18" fill="#141413"/>
    <g transform="translate(95,38)" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
      <rect x="0" y="0" width="120" height="78" rx="8"/>
      <path d="M0 18 L120 18"/>
      <rect x="10" y="28" width="46" height="40" rx="3" fill="#FFFFFF" stroke="none" opacity="0.9"/>
      <path d="M66 32 L110 32 M66 44 L104 44 M66 56 L96 56"/>
    </g>
    <text x="155" y="156" text-anchor="middle" font-size="23" font-weight="700" fill="#FFFFFF">Dashboard</text>
    <text x="155" y="186" text-anchor="middle" font-size="15.5" fill="#D6D3CB">Drives on a calendar, six cameras</text>
    <text x="155" y="209" text-anchor="middle" font-size="15.5" fill="#D6D3CB">in sync, route on a map, Pi health</text>
    <text x="155" y="256" text-anchor="middle" font-size="14" fill="#8A8883">FastAPI + SQLite · React + Fluent UI</text>
    <text x="155" y="279" text-anchor="middle" font-size="14" fill="#8A8883">GPS and speed read from the video</text>
  </g>

  <!-- ============ metrics band ============ -->
  <g transform="translate(60,496)">
    <rect width="1480" height="100" rx="14" fill="#F5F3EE"/>
    <text x="28" y="38" font-size="16" font-weight="700" fill="#141413">Also on the wire</text>
    <text x="28" y="63" font-size="14.5" fill="#4A4946">Every 5 minutes the Pi logs its temperature, Wi-Fi signal, CPU, SD space and USB state; every 5 seconds during an upload it writes a live status file.</text>
    <text x="28" y="84" font-size="14.5" fill="#4A4946">Both land in the share's PiMetrics folder and feed the Uploads and Pi pages.</text>
    <g transform="translate(1282,27)">
      <rect width="170" height="46" rx="23" fill="#FFFFFF" stroke="#E8E5DE"/>
      <circle cx="26" cy="23" r="6" fill="#15803D"/>
      <text x="44" y="28" font-size="14.5" font-weight="600" fill="#141413">nothing leaves home</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
